<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartbeat Prediction</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            text-align: center;
            background-color: #2b3945; /* Dark teal background */
            color: #ffffff; /* White text color for better contrast */
        }
        h1 {
            font-size: 2.5em;
            color: #00bfa5; /* Accent color for headers */
            margin-bottom: 30px;
        }
        form {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        input[type="file"] {
            margin: 10px 0;
            padding: 10px;
            border: 2px solid #3b6978; /* Darker border for input fields */
            border-radius: 5px;
            width: 250px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="file"]:focus {
            border-color: #00bfa5; /* Accent color on focus */
        }
        button {
            padding: 12px 24px;
            background-color: #00bfa5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s ease-in-out;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        button:hover {
            background-color: #008f81; /* Darker shade of the accent color */
            transform: scale(1.05); /* Slight scale-up on hover */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); /* Stronger shadow */
        }
        .result {
            margin-top: 30px;
            font-size: 1.2em;
            color: #2b3945; /* Dark text on a lighter background */
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #ffffff; /* Light background for results */
        }
    </style>
</head>
<body>

    <h1>Heartbeat Prediction</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".wav" required>
        <button type="submit">Upload and Predict</button>
    </form>

    <div class="result">
        <p>Prediction: <strong>{{ prediction }}</strong></p>
    </div>

</body>
</html>
